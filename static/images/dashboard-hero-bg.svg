<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 380" fill="none">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f2b48" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.15" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
      <circle cx="32" cy="0" r="1.5" fill="rgba(255, 255, 255, 0.08)"/>
    </pattern>
  </defs>

  <rect width="1440" height="380" fill="url(#heroGrad)" />
  <rect width="1440" height="380" fill="url(#grid)" />

  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="120" cy="80" r="220" fill="url(#accentGlow)" filter="blur(60px)" />
  <circle cx="1280" cy="180" r="260" fill="#2563eb" fill-opacity="0.18" filter="blur(70px)" />
  <circle cx="750" cy="320" r="180" fill="#06b6d4" fill-opacity="0.12" filter="blur(50px)" />

  <!-- Decorative Isometric Wireframe Cubes (Inventory Symbolism) -->
  <g opacity="0.18" transform="translate(1080, 40)">
    <!-- Cube 1 -->
    <path d="M 80 20 L 140 50 L 80 80 L 20 50 Z" stroke="#38bdf8" stroke-width="1.5" fill="rgba(56, 189, 248, 0.08)"/>
    <path d="M 20 50 L 80 80 L 80 150 L 20 120 Z" stroke="#38bdf8" stroke-width="1.5" fill="rgba(56, 189, 248, 0.04)"/>
    <path d="M 140 50 L 80 80 L 80 150 L 140 120 Z" stroke="#38bdf8" stroke-width="1.5" fill="rgba(56, 189, 248, 0.12)"/>
    
    <!-- Cube 2 Behind -->
    <path d="M 170 80 L 220 105 L 170 130 L 120 105 Z" stroke="#818cf8" stroke-width="1.2" fill="none"/>
    <path d="M 120 105 L 170 130 L 170 185 L 120 160 Z" stroke="#818cf8" stroke-width="1.2" fill="none"/>
    <path d="M 220 105 L 170 130 L 170 185 L 220 160 Z" stroke="#818cf8" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Ambient wave curves -->
  <path d="M 0 340 C 320 310, 540 370, 920 330 C 1200 300, 1360 350, 1440 340 L 1440 380 L 0 380 Z" fill="rgba(15, 23, 42, 0.45)" />
</svg>

