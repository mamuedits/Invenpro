{% extends 'base.html' %}

{% block title %}Delete Category – Invenpro{% endblock %}
{% block page_title %}Delete Category{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm border-0 border-top border-danger border-4">
      <div class="card-body p-4 text-center">
        <i class="bi bi-exclamation-triangle text-danger display-4 mb-2"></i>
        <h4 class="fw-bold">Delete Category?</h4>
        <p class="text-muted">Are you sure you want to remove <strong>"{{ category.name }}"</strong>?</p>
        <form method="POST">
          {% csrf_token %}
          <div class="d-flex justify-content-center gap-2 mt-4">
            <a href="{% url 'category_list' %}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-danger">Confirm Delete</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
