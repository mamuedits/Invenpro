{% extends 'base.html' %}
{% load static %}

{% block title %}Set New Password – Invenpro{% endblock %}

{% block auth_content %}
<div class="container px-3">
  <div class="auth-shell" style="max-width: 520px;">
    <div class="auth-form-pane">
      <div class="text-center mb-4">
        <div class="auth-logo-badge mb-3" style="padding: 0.6rem 1.1rem;">
          <img src="{% static 'images/invenpro-logo.png' %}?v=3.2" alt="Invenpro Logo" style="max-height: 50px;">
        </div>
        <div class="mb-2">
          <span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-1">
            <i class="bi bi-check-circle-fill me-1"></i> OTP Verified
          </span>
        </div>
        <h3 class="fw-bold mb-1">Create New Password</h3>
        <p class="text-secondary small mb-0">
          Setting a new password for account <strong>@{{ target_user.username }}</strong>.
        </p>
      </div>

      <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label small fw-semibold" for="id_new_password">New Password</label>
          <div class="input-group auth-input-group">
            <span class="input-group-text border-end-0"><i class="bi bi-key"></i></span>
            <input type="password" id="id_new_password" name="new_password" class="form-control" placeholder="Enter new password (min 6 chars)" minlength="6" required autofocus autocomplete="new-password">
            <button type="button" class="btn btn-outline-secondary border-start-0 btn-toggle-pwd-input" data-target="id_new_password" title="Show / Hide Password" style="border-color: var(--border-color);">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label small fw-semibold" for="id_confirm_password">Confirm New Password</label>
          <div class="input-group auth-input-group">
            <span class="input-group-text border-end-0"><i class="bi bi-shield-check"></i></span>
            <input type="password" id="id_confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter new password" minlength="6" required autocomplete="new-password">
            <button type="button" class="btn btn-outline-secondary border-start-0 btn-toggle-pwd-input" data-target="id_confirm_password" title="Show / Hide Password" style="border-color: var(--border-color);">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 auth-submit-btn d-flex align-items-center justify-content-center gap-2">
          <i class="bi bi-check2-circle fs-5"></i>
          <span>Update Password &amp; Sign In</span>
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
